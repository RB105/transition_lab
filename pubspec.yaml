name: transition_lab
description: >-
  Page transitions re-created from well-known apps: the Wolt swing, iOS zoom
  and sheet, Instagram cube, photo drag to dismiss, page curl, doors, mini-player.
version: 0.2.0
repository: https://github.com/RB105/transition_lab
topics:
  - animation
  - transition
  - navigation
  - page-transition
  - ui

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

screenshots:
  - description: A venue page swings in over a list, then swings back out.
    path: doc/demo.gif
  - description: The iOS 18 zoom, pulled down to shrink back into its card.
    path: doc/gifs/zoom.gif
  - description: An Apple Books page curl, turned back by its corner.
    path: doc/gifs/page_curl.gif
  - description: The page underneath opens like a pair of doors.
    path: doc/gifs/door.gif
